# quality-gate.yml — Variant B: Generic Node / Python / React (Playbook §3.4)
# canonical source: teibto-dev-standards/templates/quality-gate/ — copy ไปวางที่ .github/workflows/quality-gate.yml
# ตอน scaffold: เปิดใช้ block ของ stack ที่ repo ใช้จริง (Node หรือ Python) แล้วลบ block ที่ไม่ใช้ทิ้ง
# ชื่อ job ต้องเป็น `quality-gate` เสมอ เพื่อให้ branch protection อ้าง required check ชื่อเดียวทุก repo
# @author Wichit Wongta @since 2026-07-10

name: quality-gate

on:
  pull_request:
  push:
    tags: ["v*"] # รันก่อน release tag ด้วย (Playbook §6)

env:
  GITLEAKS_VERSION: "8.29.0" # pin โดย teibto-dev-standards — อัปเดตที่ template กลางเท่านั้น

permissions:
  contents: read

jobs:
  quality-gate:
    name: quality-gate
    # Run repository-owned changes only on the team's persistent private runner.
    if: >-
      github.event.repository.private == true &&
      (github.event_name != 'pull_request' ||
       github.event.pull_request.head.repo.full_name == github.repository)
    runs-on: [self-hosted, teibto-devtools]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - uses: actions/setup-node@v4
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: designer/package-lock.json

      # Per-job installation avoids sudo and shared /usr/local/bin writes.
      - name: Install gitleaks (pinned, per-job)
        run: |
          case "$(uname -m)" in
            aarch64|arm64) GL_ARCH=arm64 ;;
            x86_64|amd64) GL_ARCH=x64 ;;
            *) echo "Unsupported runner architecture: $(uname -m)" >&2; exit 1 ;;
          esac
          curl -sfL -o "${RUNNER_TEMP}/gitleaks.tgz" \
            "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_${GL_ARCH}.tar.gz"
          tar -xzf "${RUNNER_TEMP}/gitleaks.tgz" -C "${RUNNER_TEMP}" gitleaks
          chmod +x "${RUNNER_TEMP}/gitleaks"
          echo "${RUNNER_TEMP}" >> "${GITHUB_PATH}"
          "${RUNNER_TEMP}/gitleaks" version

      # 1) Secret scan — ห้าม opt-out ทุก governance profile (Playbook §2.4)
      - name: Secret scan (working tree + staged)
        run: bash scripts/secret-scan.sh

      - name: Secret scan (full git history)
        run: gitleaks git . --no-banner --redact

      # 2) shellcheck
      - name: shellcheck
        run: |
          files=$(find . -name "*.sh" -not -path "./node_modules/*" -not -path "./.venv/*")
          if [ -n "$files" ]; then shellcheck $files; else echo "no shell scripts"; fi

      # 3) Markdown lint เฉพาะ docs/
      - name: Markdown lint (docs/)
        run: npx --yes markdownlint-cli2 "docs/**/*.md" "README.md" "CLAUDE.md" || true
        # เริ่มแบบ non-blocking (|| true) — เอาออกเมื่อทีมเก็บ lint เดิมหมดแล้ว

      # 4) Template pack — well-formed XML + กับดัก BFO/FreeMarker (#10)
      #    รวม binding contract: master ที่ bind key นอกสิ่งที่ engine จ่ายจริง = fail (#155)
      - name: Validate templates
        run: bash scripts/validate-templates.sh

      # Project-scoped Codex/Claude profiles are an architecture boundary too:
      # both runtimes must discover the same agents and delivery skill.
      - name: Validate AI workspace
        run: |
          python3 -m unittest scripts/test_validate_ai_workspace.py
          python3 scripts/validate-ai-workspace.py

      # 4b) Engine (SuiteScript) — เดิม CI ไม่ครอบ engine/ เลย (#155)
      #     node --check จับ syntax · node --test รัน unit test ที่ mount AMD module จริง
      #     ผ่าน stub ของ N/* (engine/tests/helpers/) — ไม่ต้องมี NetSuite session
      - name: Engine — syntax check + unit tests
        run: |
          for f in engine/src/FileCabinet/SuiteScripts/pdf-layout-designer/*.js; do
            node --check "$f"
          done
          node --test "engine/tests/**/*.test.js"

      - name: Build/deploy provenance regression tests
        run: node --test scripts/build-provenance.test.mjs

      # ==================== STACK: Node (designer/) ====================
      # monorepo: แอปหลักอยู่ designer/ — ไม่มี package.json ที่ root
      - name: Node — lint + test (designer/)
        if: hashFiles('designer/package.json') != ''
        working-directory: designer
        run: |
          npm ci
          npm audit --audit-level=high
          npm run lint
          npm run test:coverage

      # Dev-server tests do not prove either deployment bundle can be produced.
      - name: Designer — production builds
        working-directory: designer
        run: |
          npm run build
          npm run build:netsuite
          npm run storybook:build

      # 5) Playwright e2e (#146) — save/render flows had no automated regression coverage in CI
      # playwright.config.ts มี webServer block ที่ auto-start `npm run dev` เอง — ไม่ต้อง start server เอง
      # chromium เท่านั้น (ไม่ครบทุก browser) เพื่อความเร็ว — blocking เหมือน lint/test ข้างบน ห้าม || true
      # history.spec.ts (#129 undo) และ inspector.spec.ts (#127 role desync) เป็น regressions ปกติแล้ว;
      # ไม่มี `test.fail()` ค้างอยู่ใน suite ปัจจุบัน
      # server-side render ผ่าน N/render จริง + save-to-NetSuite parity ยัง automate ใน CI ไม่ได้
      # (ต้องมี live NetSuite session) — คงเป็น manual QA บน SB2 ต่อไป ดู designer/tests/e2e/FINDINGS.md
      # production-performance config ใช้ dist ที่ build ไว้ด้านบน, server ใหม่, worker เดียว และ retry 0
      - name: Node — e2e (Playwright, designer/)
        if: hashFiles('designer/package.json') != ''
        working-directory: designer
        run: |
          # Chromium OS dependencies are provisioned on the team runner.
          npx playwright install chromium
          npm run test:e2e
          npx playwright test --config playwright.performance.config.ts

      # Only local-app CI output; connected sandbox evidence stays outside these paths.
      - name: Retain failed browser test diagnostics
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: browser-test-failure-${{ github.run_id }}-${{ github.run_attempt }}
          path: |
            designer/test-results/e2e-*/
            designer/test-results/performance-*/
          if-no-files-found: ignore
